<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWWhippet! - 90s Internet Simulator</title>
  <link rel="stylesheet" href="/css/desktop.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/crt-effect.css">
  <link rel="stylesheet" href="/css/netscape.css">
</head>
<body>
  <div class="outer-wrapper">
    <div class="crt-monitor">
      <div class="crt-bezel">
        <div class="crt-bezel-top"></div>
        <div class="crt-screen-container">
          <div class="crt-screen">
            <div class="crt-scanlines"></div>

            <div class="desktop" id="desktop">
              <!-- Desktop icons -->
              <div class="desktop-icons">
                <div class="desktop-icon" id="iconNetscape" title="Netscape Navigator">
                  <div class="icon-img">&#127760;</div>
                  <div class="icon-label">Netscape<br>Navigator</div>
                </div>
                <div class="desktop-icon" id="iconSettings" title="Settings">
                  <div class="icon-img">&#9881;</div>
                  <div class="icon-label">AI Settings</div>
                </div>
                <div class="desktop-icon" id="iconRecycle" title="Recycle Bin">
                  <div class="icon-img">&#128465;</div>
                  <div class="icon-label">Recycle Bin</div>
                </div>
                <div class="desktop-icon" id="iconMyComputer" title="My Computer">
                  <div class="icon-img">&#128187;</div>
                  <div class="icon-label">My Computer</div>
                </div>
                <div class="desktop-icon" id="iconGifVault" title="GIF Vault">
                  <div class="icon-img">&#127912;</div>
                  <div class="icon-label">GIF Vault</div>
                </div>
                <div class="desktop-icon" id="iconDialup" title="Dial-Up Networking">
                  <div class="icon-img">&#128222;</div>
                  <div class="icon-label">Dial-Up<br>Networking</div>
                </div>
              </div>

              <!-- Windows get spawned here by WindowManager -->

              <!-- Taskbar -->
              <div class="taskbar">
                <button class="start-button" id="startBtn">
                  <span class="start-flag">&#9776;</span> Start
                </button>
                <div class="taskbar-divider"></div>
                <div class="taskbar-tasks" id="taskbarTasks"></div>
                <div class="taskbar-tray">
                  <select id="providerSelect" class="provider-select" title="AI Provider">
                    <option value="claude">Claude</option>
                    <option value="openai">OpenAI</option>
                    <!-- <option value="ollama">Ollama</option> -->
                  </select>
                  <span class="tray-divider"></span>
                  <span class="connection-indicator" id="connectionIndicator" title="Not connected">&#128264;</span>
                  <span class="tray-divider"></span>
                  <span class="taskbar-clock" id="taskbarClock"></span>
                </div>
              </div>
            </div>

          </div>
        </div>
        <div class="crt-bezel-bottom">
          <div class="crt-power-led" id="powerLed"></div>
          <div class="crt-buttons">
            <div class="crt-btn"></div>
            <div class="crt-btn"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/audio.js"></script>
  <script src="/js/throbber.js"></script>
  <script src="/js/window-manager.js"></script>
  <script src="/js/browser.js"></script>
  <script src="/js/menus.js"></script>
  <script src="/js/dialup.js"></script>
  <script src="/js/provider-switcher.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
